<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../css/projects.css" />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="../fonts/RobotoMono-Bold.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff"
      href="../fonts/Stellar-light.woff"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="../fonts/ChakraPetch-Medium.ttf"
      crossorigin
    />
    <script defer src="../js/components.js" type="module"></script>
    <script defer src="../js/script.js" type="module"></script>
    <script
      defer
      src="https://kit.fontawesome.com/c845919294.js"
      crossorigin
    ></script>
    <title>Tom Halstead | Projects</title>
  </head>
  <body>
    <site-header></site-header>

    <main class="wrapper">
      <h2 class="title">Personal projects:</h2>

      <section class="project-section">
        <!-- Forkify -->
        <div
          class="box animate__animated animate__fadeInTopLeft animate__delay-1s"
        >
          <h3 class="box-h3">Javascript recipe website</h3>
          <a
            href="https://forkify-thomashalstead.netlify.app/"
            class="projects-img"
            target="_blank"
            data-default="Hover for more info"
            data-info="Forkify: Vanilla JS app for searching recipes via API, bookmarking, adding your own, and step-by-step cooking view."
          >
            <img
              src="../images/optimized/Forkify thumbnail-320.avif"
              alt="Forkify website created through my javscript course"
              class="projects"
            />
          </a>

          <!-- Hover-reveal stack (Forkify) -->
          <div class="stack-reveal" aria-hidden="true">
            <ul class="stack-list">
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/javascript-icon.png"
                  alt="JavaScript"
                />
                <span>JavaScript</span>
              </li>
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/html5-icon.png"
                  alt="HTML"
                />
                <span>HTML</span>
              </li>
              <li class="stack-item">
                <img class="stack-ico" src="../icons/css3-icon.png" alt="CSS" />
                <span>CSS</span>
              </li>
            </ul>
          </div>
        </div>

        <!-- Vita Nova -->
        <div
          class="box animate__animated animate__fadeInDownBig animate__delay-2s"
        >
          <h3 class="box-h3">Vita Nova</h3>
          <a
            href="https://www.vitanova-app.com"
            class="projects-img"
            target="_blank"
            data-default="Hover for more info"
            data-info="Vita Nova: Java, Springboot, PostgreSQL, React UI, AWS (Cognito/S3/RDS/ECR). Track workouts, nutrition, and goals."
          >
            <img
              src="../images/optimized/VitaNova-thumbnail2-320.avif"
              alt="Health and fitness web app"
              class="projects"
            />
          </a>

          <!-- Hover-reveal stack (Vita Nova) -->
          <div class="stack-reveal" aria-hidden="true">
            <ul class="stack-list">
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/java-icon.png"
                  alt="Java"
                />
                <span>Java</span>
              </li>
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/springboot-icon.png"
                  alt="Spring Boot"
                />
                <span>Spring Boot</span>
              </li>
              <li class="stack-item">
                <img class="stack-ico" src="../icons/aws-icon.png" alt="AWS" />
                <span>AWS</span>
              </li>
              <li class="stack-item">
                <img class="stack-ico" src="../icons/sql-icon.png" alt="SQL" />
                <span>SQL</span>
              </li>
            </ul>
          </div>
        </div>

        <!-- Expense Tracker CLI -->
        <div
          class="box animate__animated animate__fadeInTopRight animate__delay-1s"
        >
          <h3 class="box-h3">Expense Tracking CLI</h3>
          <a
            href="https://github.com/Tom-Halstead/ExpenseTracker"
            class="projects-img"
            target="_blank"
            data-default="Hover for more info"
            data-info="Expense Tracker CLI: Java + Spring; categorize expenses, summaries, CSV import/export."
          >
            <img
              src="../images/optimized/sized-expense-tracker-image-320.avif"
              alt="A simple financial management CLI"
              class="projects"
            />
          </a>

          <!-- Hover-reveal stack (Expense Tracker) -->
          <div class="stack-reveal" aria-hidden="true">
            <ul class="stack-list">
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/java-icon.png"
                  alt="Java"
                />
                <span>Java</span>
              </li>
              <li class="stack-item">
                <img
                  class="stack-ico"
                  src="../icons/springboot-icon.png"
                  alt="Spring Boot"
                />
                <span>Spring Boot</span>
              </li>
              <li class="stack-item">
                <img class="stack-ico" src="../icons/sql-icon.png" alt="SQL" />
                <span>SQL</span>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <!-- Removed the old "Tools and know-hows" block per request -->

      <section class="credentials">
        <!-- Left column: Resume -->
        <article class="certs">
          <a
            href="https://drive.google.com/file/d/1cdEcCbUqj8QDj6d7BP9snZuMWEGY1IEi/view?usp=drive_link"
            class="credlink title"
            target="_blank"
            data-label="Resume"
          >
            <img
              class="certs-image"
              src="../images/sized-resume.png"
              alt="Resume preview"
            />
          </a>
        </article>

        <!-- Right column: Certifications (stacked vertically) -->
        <article class="certs">
          <a
            href="https://drive.google.com/file/d/1iMf6s0s_TY4dxLWxAJ5GQ_NRUBMWh_za/view?usp=drive_link"
            class="credlink title"
            target="_blank"
            data-label="Certification"
          >
            <img
              class="certs-image"
              src="../images/Sized Tech Elevator Cert.png"
              alt="Tech Elevator certificate"
            />
          </a>

          <a
            href="https://drive.google.com/file/d/1zhqVb5Qc5QYYPutLydAeZ4Tp92rK2kUW/view?usp=sharing"
            class="credlink title"
            target="_blank"
            data-label="Certification"
          >
            <img
              class="certs-image"
              src="../images/sized-udemy-cert.png"
              alt="Udemy certificate"
            />
          </a>
        </article>
      </section>
    </main>

    <site-footer></site-footer>
  </body>
</html>
