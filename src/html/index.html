<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Animate.css should be linked, not imported from JS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
      integrity="sha512-c9m1qNV+QvB6n8TugDq8pD8x+1vS3i8t0bKc1i0b3zqZy6hRk3+X6r8Z0q7n4kzM6Qn9Cw4L4E9x8+7R2C6M2Q=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />

    <link rel="stylesheet" href="../css/index.css" />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="../fonts/RobotoMono-Bold.ttf"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff"
      href="../fonts/Stellar-light.woff"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/ttf"
      href="../fonts/ChakraPetch-Medium.ttf"
      crossorigin
    />

    <script defer src="../js/components.js" type="module"></script>
    <script defer src="../js/script.js" type="module"></script>
    <script
      defer
      src="https://kit.fontawesome.com/c845919294.js"
      crossorigin
    ></script>
    <title>Tom Halstead | Portfolio</title>
  </head>

  <body>
    <site-header></site-header>

    <div class="container">
      <div class="text">
        <h1 class="animate__animated animate__fadeInUpBig animate__delay-1s">
          <span class="greeting">Hello,</span> I'm
          <span class="name">Tom.</span>
        </h1>

        <!-- TYPEWRITER TARGET -->
        <h2
          class="animate__animated animate__fadeInBottomRight animate__delay-2s"
        >
          A <span class="detail">detail-oriented,</span> full-stack
          <span class="developer">developer.</span>
        </h2>
      </div>
    </div>

    <site-footer></site-footer>
  </body>
</html>
